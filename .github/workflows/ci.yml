name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege default: jobs escalate only what they need.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Core quality gate: typecheck + lint + unit tests + build + audit
  # ---------------------------------------------------------------------------
  quality:
    name: Typecheck / Lint / Unit / Build / Audit
    runs-on: ubuntu-latest
    env:
      # Provide stub values so Next.js build does not fail on missing env vars.
      # Real values are NOT needed for a type-check + unit + build job.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
        # Expected script in package.json: "typecheck": "tsc --noEmit"

      - name: Lint
        run: npm run lint
        # Expected script in package.json: "lint": "next lint"

      - name: Unit tests (Vitest)
        run: npm run test:unit -- --reporter=verbose
        # Expected script in package.json: "test:unit": "vitest run"

      - name: Build (Next.js)
        run: npm run build

      - name: Security audit (npm)
        # Fail CI on high or critical severity vulnerabilities.
        # Moderate and low are reported but do not block.
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # Supply chain: SBOM generation (CycloneDX) — artifact for compliance audits
  # ---------------------------------------------------------------------------
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fffe0a32cf18edff6caf  # v4.4.3
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  # ---------------------------------------------------------------------------
  # SAST: CodeQL (GitHub-native, free on public + private repos)
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    # CodeQL results upload requires these permissions.
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
        # Add 'python' here if a Python helper script is ever added to the repo.

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ---------------------------------------------------------------------------
  # Lighthouse CI — performance + accessibility budget gate (frontend present)
  # Run only on pull requests so we have a preview URL to test against.
  # The senior-dev should wire LHCI_SERVER or use temporary-public-storage.
  # ---------------------------------------------------------------------------
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder_anon_key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@latest autorun --config=./lighthouserc.json
        env:
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.head_ref }}

  # ---------------------------------------------------------------------------
  # E2E (Playwright) — optional gated job; runs on PRs and main pushes.
  # Requires SUPABASE_DB_URL and service-role key to stand up test data.
  # Gate: only runs when the E2E secret group is configured (senior-dev step).
  # The senior-dev should extend this with actual test environment setup.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    # Guard: skip gracefully if the required secrets are not yet configured.
    if: ${{ vars.E2E_ENABLED == 'true' }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.STAGING_SITE_URL }}

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.STAGING_SITE_URL }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fffe0a32cf18edff6caf  # v4.4.3
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
