name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege default: jobs escalate only what they need.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Core quality gate: typecheck + lint + unit tests + build + audit
  # ---------------------------------------------------------------------------
  quality:
    name: Typecheck / Lint / Unit / Build / Audit
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # No DB stub: the D1 client reads the `DB` binding at request time
      # (getCloudflareContext); unit tests mock @/lib/db directly.
      # NextAuth v5 stubs
      AUTH_SECRET: placeholder_auth_secret_32chars_minimum_length
      AUTH_GOOGLE_ID: placeholder_google_id
      AUTH_GOOGLE_SECRET: placeholder_google_secret
      AUTH_URL: http://localhost:3000
      # Other service stubs
      ANTHROPIC_API_KEY: placeholder_anthropic_key
      RESEND_API_KEY: placeholder_resend_key
      CRON_SECRET: placeholder_cron_secret
      NEXT_PUBLIC_META_APP_ID: placeholder_meta_app_id

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm exec eslint src

      - name: Unit tests (Vitest)
        run: pnpm run test:unit -- --reporter=verbose

      - name: SQL smoke tests (local D1 via Miniflare)
        run: pnpm run test:sql

      - name: Migration script tests (D1 + R2)
        run: node --test scripts/migrate-to-d1/*.test.mjs scripts/migrate-to-r2/*.test.mjs

      - name: i18n missing-key test
        run: pnpm run test:i18n -- --reporter=verbose

      - name: Build (Next.js)
        run: pnpm run build

      # OpenNext build + gzipped Worker size gate. Fails over 3 MiB (Workers
      # Free) unless vars.WORKER_SIZE_LIMIT_BYTES overrides it (e.g. Paid).
      - name: Build Worker (OpenNext) + size check
        run: pnpm cf:build && pnpm cf:size
        env:
          WORKER_SIZE_LIMIT_BYTES: ${{ vars.WORKER_SIZE_LIMIT_BYTES }}

      - name: Security audit
        run: pnpm audit --prod --audit-level=high

      - name: License audit (deny AGPL/GPL/LGPL/SSPL)
        run: >
          pnpm dlx license-checker@25.0.1 --onlyAllow
          "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;CC0-1.0;CC-BY-3.0;CC-BY-4.0;0BSD;Unlicense;Python-2.0;BlueOak-1.0.0"
          --excludePrivatePackages
          || true

      - name: Typosquat heuristic check
        run: node scripts/check-typosquat.mjs
        env:
          CI: 'true'

      - name: Bundle size check (size-limit)
        run: |
          if [ -f .size-limit.json ]; then
            pnpm dlx size-limit@14.3.0 --json || true
          fi

  # ---------------------------------------------------------------------------
  # Supply chain: SBOM generation (CycloneDX) — artifact for compliance audits
  # ---------------------------------------------------------------------------
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate CycloneDX SBOM
        run: pnpm dlx @cyclonedx/cyclonedx-npm@7.0.1 --output-file sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  # ---------------------------------------------------------------------------
  # SAST: CodeQL (GitHub-native)
  #
  # NOTE: Uploading SARIF results to the GitHub Security tab (code-scanning API)
  # requires GitHub Advanced Security, which is NOT available on free private
  # repos. The `upload: false` setting on the analyze step disables the
  # code-scanning API upload that would 403, while keeping the SAST scan itself
  # running. The SARIF file is uploaded as a regular build artifact so findings
  # are still retrievable. To enable the Security tab integration, upgrade the
  # repo to GitHub Team / Enterprise with Advanced Security enabled.
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    # GHAS code-scanning upload is unavailable on free private repos, hence
    # `upload: false` on the analyze step (SARIF is kept as a build artifact).
    # `actions: read` is required: codeql-action probes get-a-workflow-run for telemetry.
    # Once GHAS is enabled: restore `security-events: write` and drop `upload: false`.
    permissions:
      contents: read
      actions: read           # required: codeql-action calls get-a-workflow-run for telemetry
      security-events: write  # harmless with upload:false; some codeql-action versions probe it

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
        # Add 'python' here if a Python helper script is ever added to the repo.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9  # v3.39.3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@9418214df1f2c4b8128c770156c409013b07d6b9  # v3.39.3

      - name: Analyze
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9  # v3.39.3
        with:
          category: "/language:${{ matrix.language }}"
          # upload: false — skips the code-scanning API upload that requires
          # GitHub Advanced Security (not available on free private repos).
          # The SARIF output is captured and uploaded as a build artifact below.
          upload: false
          output: sarif-results

      - name: Upload SARIF as build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: sarif-results/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Lighthouse CI — performance + accessibility budget gate (frontend present)
  # Run only on pull requests so we have a preview URL to test against.
  # ---------------------------------------------------------------------------
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    # Shared by the build AND the server LHCI starts.
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      AUTH_SECRET: placeholder_auth_secret_32chars_minimum_length
      AUTH_GOOGLE_ID: placeholder_google_id
      AUTH_GOOGLE_SECRET: placeholder_google_secret
      AUTH_URL: http://localhost:3000
      ANTHROPIC_API_KEY: placeholder_anthropic_key
      RESEND_API_KEY: placeholder_resend_key
      CRON_SECRET: placeholder_cron_secret
      NEXT_PUBLIC_META_APP_ID: placeholder_meta_app_id

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run Lighthouse CI
        # `npm run start` boots the Next.js server (port 3000) from the build
        # output. lighthouserc.json's startServerCommand handles startup; LHCI
        # waits for the server to be ready before collecting.
        run: pnpm dlx @lhci/cli@0.16.1 autorun --config=./lighthouserc.json
        env:
          LHCI_BUILD_CONTEXT__CURRENT_BRANCH: ${{ github.head_ref }}

  # ---------------------------------------------------------------------------
  # E2E (Playwright) — optional gated job; runs on PRs and main pushes.
  # Requires STAGING_DATABASE_URL (Fly Postgres) to stand up test data.
  # Gate: only runs when the E2E secret group is configured (senior-dev step).
  # The senior-dev should extend this with actual test environment setup.
  # Cloudflare: still targets `next build/start` (Postgres). Switching to
  # `pnpm cf:preview` needs a seeded local D1, which arrives with W-CF-14.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    # Guard: skip gracefully if the required secrets are not yet configured.
    # Fork PRs get no secrets, so the job only runs for same-repo PRs and pushes.
    if: ${{ vars.E2E_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.STAGING_SITE_URL }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      - name: Run E2E tests
        run: pnpm run test:e2e
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.STAGING_SITE_URL }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Deploy to Fly.io — runs on every push to main after quality gate passes.
  # Requires FLY_API_TOKEN secret set in GitHub repo settings.
  # Transition switch: only runs while vars.DEPLOY_TARGET == 'fly'.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: quality
    if: vars.DEPLOY_TARGET == 'fly' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: Production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Deploy
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1  # v1.6

      - run: flyctl deploy --remote-only --app propflow-app
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ---------------------------------------------------------------------------
  # Deploy to Cloudflare Workers — push to main, only while
  # vars.DEPLOY_TARGET == 'cloudflare' (cutover and rollback = flip the var).
  # Applies pending D1 migrations before shipping the new Worker.
  # Requires secrets.CLOUDFLARE_API_TOKEN and vars.CLOUDFLARE_ACCOUNT_ID.
  # ---------------------------------------------------------------------------
  deploy-cloudflare:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    needs: quality
    if: vars.DEPLOY_TARGET == 'cloudflare' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: Production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Worker (OpenNext)
        run: pnpm cf:build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.APP_URL }}

      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply propflow-db --remote

      - name: Deploy Worker
        run: pnpm exec wrangler deploy
