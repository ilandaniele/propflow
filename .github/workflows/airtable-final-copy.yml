# .github/workflows/airtable-final-copy.yml
#
# One-off: copies every file still referenced by an expiring Airtable URL into
# our own storage, by calling the protected route on the live app (Airtable and
# storage credentials only exist as Worker secrets). Run `dry-run` first, then
# `apply`. After `apply` the workflow runs one final dry-run and fails unless
# it reports remaining == 0. Permanent failures (file gone, type not allowed)
# are reported but do not fail the run.
#
# `report` diagnoses those permanent failures against Airtable today; `recover`
# copies every one that can still be found. `verify` reads every Airtable table
# again and compares it with our copy (records, field values, attachments).
# `refresh` updates our snapshots to Airtable today (previous data archived
# first); run `apply` after it to copy attachments added since the last copy.
# Every mode only reads Airtable; `verify` writes nothing anywhere.
#
# Only counters, table/field names and reason codes are printed — never
# response bodies, refs, file names or URLs.
#
# Required GitHub settings:
#   vars.APP_URL        — https://propflow-app.ilandaniele.workers.dev
#   secrets.CRON_SECRET — same value as the Worker secret CRON_SECRET

name: Airtable final copy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run validates without writing; apply copies files and updates the DB'
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply
          - report
          - recover
          - verify
          - refresh

permissions:
  contents: read

concurrency:
  group: airtable-final-copy
  cancel-in-progress: false

jobs:
  copy:
    name: 'Copy attachments (${{ github.event.inputs.mode }})'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Run batches
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          set -u
          BODY="$RUNNER_TEMP/batch.json"

          # post_batch <mode> <limit>: sets STATUS and leaves the JSON body in $BODY
          post_batch() {
            STATUS=$(curl -sS -o "$BODY" -w "%{http_code}" \
              -X POST "$APP_URL/api/cron/airtable-final-copy?mode=$1&limit=$2" \
              -H "Authorization: Bearer $CRON_SECRET" \
              --max-time 900)
            if [ "$STATUS" -ge 400 ]; then
              echo "HTTP $STATUS" >&2
              exit 1
            fi
            COPIED=$(jq -r '.copied' "$BODY")
            SKIPPED=$(jq -r '.skipped' "$BODY")
            FAILED=$(jq -r '.failed' "$BODY")
            REMAINING=$(jq -r '.remaining' "$BODY")
            PERMANENT=$(jq -r '.permanentFailures // 0' "$BODY")
            echo "mode=$1 copied=$COPIED skipped=$SKIPPED failed=$FAILED remaining=$REMAINING permanent_failures=$PERMANENT"
            if [ "$FAILED" -gt 0 ]; then
              jq -r '.errors | group_by(.reason)[] | "  failed reason=\(.[0].reason) count=\(length)"' "$BODY"
            fi
          }

          # post_recover <mode> <after>: sets NEXT_AFTER and prints grouped counts only
          post_recover() {
            STATUS=$(curl -sS -o "$BODY" -w "%{http_code}" -G \
              -X POST "$APP_URL/api/cron/airtable-final-copy" \
              --data-urlencode "mode=$1" --data-urlencode "limit=50" --data-urlencode "after=$2" \
              -H "Authorization: Bearer $CRON_SECRET" \
              --max-time 900)
            if [ "$STATUS" -ge 400 ]; then
              echo "HTTP $STATUS" >&2
              exit 1
            fi
            jq -r '"mode=\(.mode) total=\(.total) processed=\(.processed) recovered=\(.recovered) errors=\(.errors | length)"' "$BODY"
            jq -r '.groups[] | "  table=\(.table) field=\(.field) reason=\(.reason) verdict=\(.verdict) count=\(.count)"' "$BODY"
            jq -r '.errors | group_by(.reason)[] | "  error reason=\(.[0].reason) count=\(length)"' "$BODY"
            NEXT_AFTER=$(jq -r '.nextAfter // ""' "$BODY")
          }

          # post_verify <after>: sets NEXT_AFTER and prints counts and field names only
          post_verify() {
            STATUS=$(curl -sS -o "$BODY" -w "%{http_code}" -G \
              -X POST "$APP_URL/api/cron/airtable-final-copy" \
              --data-urlencode "mode=verify" --data-urlencode "after=$1" \
              -H "Authorization: Bearer $CRON_SECRET" \
              --max-time 900)
            if [ "$STATUS" -ge 400 ]; then
              echo "HTTP $STATUS" >&2
              exit 1
            fi
            jq -r '.table // empty | "table=\(.table) airtable_records=\(.airtableRecords) snapshot_records=\(.snapshotRecords) missing_records=\(.missingRecords) deleted_in_airtable=\(.deletedInAirtable) attachments=\(.attachments) copied=\(.attachmentsCopied) lost=\(.attachmentsLost) missing=\(.attachmentsMissing)"' "$BODY"
            jq -r '.table // empty | .changedFields | to_entries[] | "  changed field=\(.key) records=\(.value)"' "$BODY"
            jq -r '.error // empty | "table=\(.table) error=\(.reason)"' "$BODY"
            NEXT_AFTER=$(jq -r '.nextAfter // ""' "$BODY")
          }

          # post_refresh <after>: sets NEXT_AFTER and prints counts only
          post_refresh() {
            STATUS=$(curl -sS -o "$BODY" -w "%{http_code}" -G \
              -X POST "$APP_URL/api/cron/airtable-final-copy" \
              --data-urlencode "mode=refresh" --data-urlencode "after=$1" \
              -H "Authorization: Bearer $CRON_SECRET" \
              --max-time 900)
            if [ "$STATUS" -ge 400 ]; then
              echo "HTTP $STATUS" >&2
              exit 1
            fi
            jq -r '.table // empty | "table=\(.table) updated=\(.updated) inserted=\(.inserted) unchanged=\(.unchanged) skipped_no_org=\(.skippedNoOrg)"' "$BODY"
            jq -r '.error // empty | "table=\(.table) error=\(.reason)"' "$BODY"
            NEXT_AFTER=$(jq -r '.nextAfter // ""' "$BODY")
          }

          if [ "$MODE" = "refresh" ]; then
            AFTER=""
            while :; do
              post_refresh "$AFTER"
              [ -z "$NEXT_AFTER" ] && break
              AFTER=$NEXT_AFTER
            done
            exit 0
          fi

          if [ "$MODE" = "verify" ]; then
            AFTER=""
            while :; do
              post_verify "$AFTER"
              [ -z "$NEXT_AFTER" ] && break
              AFTER=$NEXT_AFTER
            done
            jq -r '.columnsOnAirtable | to_entries[] | "column=\(.key) still_on_airtable=\(.value)"' "$BODY"
            exit 0
          fi

          if [ "$MODE" = "report" ] || [ "$MODE" = "recover" ]; then
            AFTER=""
            BATCH=0
            while :; do
              BATCH=$((BATCH + 1))
              echo "batch $BATCH"
              post_recover "$MODE" "$AFTER"
              [ -z "$NEXT_AFTER" ] && break
              AFTER=$NEXT_AFTER
            done
            exit 0
          fi

          if [ "$MODE" = "dry-run" ]; then
            post_batch dry-run 100
            [ "$FAILED" -eq 0 ]
            exit 0
          fi

          BATCH=0
          PERMANENT=0
          while :; do
            BATCH=$((BATCH + 1))
            echo "batch $BATCH"
            PREV_PERMANENT=$PERMANENT
            post_batch apply 100
            [ "$REMAINING" -eq 0 ] && break
            if [ $((COPIED + SKIPPED)) -eq 0 ] && [ "$PERMANENT" -eq "$PREV_PERMANENT" ]; then
              echo "No progress in this batch, stopping"
              break
            fi
          done

          echo "verification (dry-run)"
          post_batch dry-run 1
          if [ "$REMAINING" -ne 0 ]; then
            echo "remaining=$REMAINING after apply" >&2
            exit 1
          fi
          if [ "$PERMANENT" -gt 0 ]; then
            echo "::warning::$PERMANENT permanent failures; run mode=report to diagnose them"
          fi
