# .github/workflows/cron-dispatch.yml
#
# WHY GitHub Actions instead of Fly scheduled machines:
# Fly.io scheduled machines (fly machine run --schedule) only support coarse
# intervals: hourly / daily / weekly / monthly — with NO time-of-day control.
# That makes it impossible to hit 08:00 UTC vs 04:00 UTC daily from fly.toml.
# This workflow replicates the four Vercel cron jobs with exact schedules and
# replaces vercel.json entirely.  The `plan` job selects the endpoint(s) for the
# trigger; the `dispatch` matrix POSTs to the live app with the CRON_SECRET
# bearer token already used by all /api/cron/* handlers.  Only the HTTP status
# code is logged (never the response body); status >= 400 fails the job.
#
# Required GitHub settings:
#   vars.APP_URL    — https://propflow-app.fly.dev  (repo variable, not a secret)
#   secrets.CRON_SECRET — same value as the Fly secret CRON_SECRET

name: Cron dispatch

on:
  schedule:
    - cron: '0 7 * * 1'    # weekly-summary   — 07:00 UTC Monday
    - cron: '0 8 * * *'    # reminders        — 08:00 UTC daily
    - cron: '0 9 * * *'    # task-reminders   — 09:00 UTC daily
    - cron: '0 12 * * 1'   # qa-export        — 07:00 Lima Monday (Phase 5-6)
    - cron: '0 14 * * *'   # lead-alerts      — 09:00 Lima daily (Phase 5-6)
    - cron: '*/10 * * * *' # agent-dispatch   — every 10 min (backstop; primary drain is instrumentation.ts)
    - cron: '0 15 * * 1-6' # voice-reactivation — 10:00 Lima, Mon-Sat
  workflow_dispatch:
    inputs:
      job:
        description: 'Which cron to run manually'
        required: true
        type: choice
        options:
          - weekly-summary
          - reminders
          - task-reminders
          - qa-export
          - lead-alerts
          - agent-dispatch
          - voice-reactivation

permissions:
  contents: read

jobs:
  plan:
    name: Select cron endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select endpoints for this trigger
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_JOB: ${{ github.event.inputs.job }}
        run: |
          # job|cron schedule|timeout-minutes|curl --max-time seconds
          ENDPOINTS='weekly-summary|0 7 * * 1|2|90
          reminders|0 8 * * *|2|90
          task-reminders|0 9 * * *|2|90
          qa-export|0 12 * * 1|4|240
          lead-alerts|0 14 * * *|5|240
          agent-dispatch|*/10 * * * *|2|60
          voice-reactivation|0 15 * * 1-6|4|240'
          if [ "$EVENT_NAME" = "schedule" ]; then
            FIELD=schedule; SELECTOR="$EVENT_SCHEDULE"
          else
            FIELD=job; SELECTOR="$INPUT_JOB"
          fi
          MATRIX=$(printf '%s\n' "$ENDPOINTS" | jq -R -s -c --arg field "$FIELD" --arg selector "$SELECTOR" '
            [split("\n")[] | select(length > 0) | ltrimstr(" ") | split("|")
              | {job: .[0], schedule: .[1], timeout: (.[2] | tonumber), max_time: (.[3] | tonumber)}]
            | map(select(.[$field] == $selector))
            | {include: .}')
          if [ "$(printf '%s' "$MATRIX" | jq '.include | length')" -eq 0 ]; then
            echo "No cron endpoint matches this trigger" >&2
            exit 1
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  dispatch:
    name: 'Cron: ${{ matrix.job }}'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: POST /api/cron/${{ matrix.job }}
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB: ${{ matrix.job }}
          MAX_TIME: ${{ matrix.max_time }}
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST "$APP_URL/api/cron/$JOB" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --max-time "$MAX_TIME")
          echo "HTTP $STATUS"
          [ "$STATUS" -lt 400 ]
